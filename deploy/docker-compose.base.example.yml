name: nuvio-base-local

services:
  nuvio-backoffice:
    image: nuvio-backoffice:local
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_PB_BACKEND_URL: ${NUVIO_BACKOFFICE_BROWSER_URL:-http://localhost:8090}
        VITE_PUBLIC_SITE_BASE_URL: ${NUVIO_PUBLIC_BROWSER_URL:-http://localhost:3000}
    env_file:
      - ./env.backend.local
    ports:
      - "${NUVIO_BACKOFFICE_PORT:-8090}:8090"
    volumes:
      - nuvio_base_pb_data:/app/pb_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  nuvio-public:
    image: nuvio-public-runtime:local
    build:
      context: ../../../tmpGallery/cms5
      dockerfile: Dockerfile
      args:
        VITE_PB_URL: ${NUVIO_BACKOFFICE_BROWSER_URL:-http://localhost:8090}
        VITE_NUVIO_BACKEND_URL: ${NUVIO_BACKOFFICE_BROWSER_URL:-http://localhost:8090}
        VITE_PUBLIC_SITE_BASE_URL: ${NUVIO_PUBLIC_BROWSER_URL:-http://localhost:3000}
        VITE_CMS_PREVIEW_PARENT_ORIGIN: ${NUVIO_BACKOFFICE_BROWSER_URL:-http://localhost:8090}
    env_file:
      - ./env.public.local
    environment:
      # Server-side calls inside Docker should use Compose DNS, not localhost.
      NUVIO_BACKEND_URL: http://nuvio-backoffice:8090
      PB_URL: http://nuvio-backoffice:8090
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "${NUVIO_PUBLIC_PORT:-3000}:3000"
    depends_on:
      nuvio-backoffice:
        condition: service_healthy

volumes:
  nuvio_base_pb_data: